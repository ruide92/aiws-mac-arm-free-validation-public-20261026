name: mm-arm-buyer-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PRIVATE_REPO: ruide92/aiws-mac-arm-free-validation-20261026
      RELEASE_TAG: arm64-free-validation-20261026
      DMG_NAME: arm64.dmg
      EXPECTED_SHA256: 852ddacab39f322345d049c36e1e4b299cee409d8c94305e3bdcd6eb6b3413d5
    steps:
      - name: Probe Apple Silicon host
        run: |
          set -euxo pipefail
          uname -a; uname -m; sysctl -n machdep.cpu.brand_string; sw_vers
          system_profiler SPHardwareDataType | sed -n '1,30p'

      - name: Download and mount MM DMG
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ASSET_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/mm/volume" "$RUNNER_TEMP/mm/evidence"
          gh release download "$RELEASE_TAG" --repo "$PRIVATE_REPO" --pattern "$DMG_NAME" --dir "$RUNNER_TEMP/mm"
          test "$(shasum -a 256 "$RUNNER_TEMP/mm/$DMG_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          hdiutil attach "$RUNNER_TEMP/mm/$DMG_NAME" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mm/volume"
          find "$RUNNER_TEMP/mm/volume" -maxdepth 2 -name '*.app' -print
          for app in "$RUNNER_TEMP/mm/volume"/*.app; do
            name=$(basename "$app" .app)
            ditto "$app" "$RUNNER_TEMP/mm/$name.app"
            xattr -dr com.apple.quarantine "$RUNNER_TEMP/mm/$name.app" || true
            echo "--- $name ---"
            file "$RUNNER_TEMP/mm/$name.app/Contents/MacOS/"* || true
            lipo -archs "$RUNNER_TEMP/mm/$name.app/Contents/MacOS/"* || true
            codesign -dv --verbose=2 "$RUNNER_TEMP/mm/$name.app" 2>&1 | sed -n '1,12p' || true
          done

      - name: Launch DeepSeek and inspect GUI
        run: |
          set -uxo pipefail
          app="$RUNNER_TEMP/mm/DeepSeek Harness.app"
          open -n "$app" --args --remote-debugging-port=9222 || true
          sleep 15
          echo '--- processes ---'
          pgrep -af 'DeepSeek|AIWS' || true
          echo '--- windows ---'
          osascript -e 'tell application "System Events" to get {name, background only} of every process whose name is "DeepSeek Harness"' 2>&1 || true
          osascript -e 'tell application "System Events" to tell process "DeepSeek Harness" to get name of every window' 2>&1 || true
          echo '--- cdp version ---'
          curl -sS --max-time 5 http://127.0.0.1:9222/json/version || true
          echo '--- cdp pages ---'
          curl -sS --max-time 5 http://127.0.0.1:9222/json/list || true
          screencapture -x "$RUNNER_TEMP/mm/evidence/deepseek-welcome.png" || true
          echo '--- attempt UI click Add API Key ---'
          osascript -e 'tell application "System Events" to tell process "DeepSeek Harness" to click button "Add API Key" of window 1' 2>&1 || true
          sleep 3
          screencapture -x "$RUNNER_TEMP/mm/evidence/deepseek-after-click.png" || true
          echo '--- UI elements after click ---'
          osascript -e 'tell application "System Events" to tell process "DeepSeek Harness" to get {name, role, description} of every UI element of window 1' 2>&1 || true

      - name: Quit and relaunch DeepSeek
        if: always()
        run: |
          set -uxo pipefail
          osascript -e 'tell application "DeepSeek Harness" to quit' 2>&1 || true
          sleep 4
          pgrep -af 'DeepSeek' || true
          open -n "$RUNNER_TEMP/mm/DeepSeek Harness.app" || true
          sleep 10
          pgrep -af 'DeepSeek' || true
          screencapture -x "$RUNNER_TEMP/mm/evidence/deepseek-reopen.png" || true

      - name: Launch Hermes and capture
        if: always()
        run: |
          set -uxo pipefail
          app="$RUNNER_TEMP/mm/Hermes Agent.app"
          open -n "$app" || true
          sleep 15
          pgrep -af 'Hermes|AIWS' || true
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1 || true
          screencapture -x "$RUNNER_TEMP/mm/evidence/hermes-welcome.png" || true
          system_profiler SPUSBDataType | sed -n '1,120p' > "$RUNNER_TEMP/mm/evidence/usb.txt" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm-arm-buyer-probe
          path: ${{ runner.temp }}/mm/evidence
          if-no-files-found: warn

      - name: Detach DMG
        if: always()
        run: hdiutil detach "$RUNNER_TEMP/mm/volume" -force 2>&1 || true
